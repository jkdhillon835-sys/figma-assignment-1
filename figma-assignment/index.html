<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>figma-assignment</title>
    <!-- Link your CSS -->
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      /* Ensure background container stays behind */
      .falling-squares {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1; /* pushes it behind everything */
        overflow: hidden;
      }

      .square {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(91, 95, 255, 0.6);
        animation: fall linear infinite;
        border-radius: 4px;
      }

      @keyframes fall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }

      .shooting-star {
        position: fixed;
        width: 120px;
        height: 2px;
        background: linear-gradient(90deg, #00b7ff, transparent);
        pointer-events: none;
        transform: rotate(45deg);
        animation: fadeOut 0.8s forwards;
        z-index: 9999; /* cursor trail stays visible */
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
          transform: scaleX(1) rotate(45deg);
        }
        to {
          opacity: 0;
          transform: scaleX(0.2) rotate(45deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Background container -->
    <div class="falling-squares"></div>

    <!-- React root -->
    <div id="root"></div>

    <!-- React entry point -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Futuristic effects script -->
    <script>
      // Falling squares
      const container = document.querySelector(".falling-squares");

      for (let i = 0; i < 40; i++) {
        const square = document.createElement("div");
        square.classList.add("square");
        square.style.left = Math.random() * 100 + "vw";
        square.style.animationDuration = 5 + Math.random() * 10 + "s";
        square.style.background =
          Math.random() > 0.5
            ? "rgba(0,183,255,0.6)"
            : "rgba(91,95,255,0.6)";
        container.appendChild(square);
      }

      // Shooting star cursor
      document.addEventListener("mousemove", (e) => {
        const star = document.createElement("div");
        star.classList.add("shooting-star");
        star.style.left = e.pageX + "px";
        star.style.top = e.pageY + "px";
        document.body.appendChild(star);

        setTimeout(() => {
          star.remove();
        }, 800);
      });
    </script>
  </body>
</html>
